services:
  - type: web
    name: bizskills-api
    runtime: node
    buildCommand: pnpm install && pnpm --filter api run build && pnpm --filter api run prisma:generate
    startCommand: pnpm --filter api run prisma:migrate:deploy && pnpm --filter api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
